name: link-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclusions (verified by hand instead):
          #  - npmjs.com / crates.io / rubygems.org / packagist.org - registries reject bots with 403
          #  - *.gov.bd - Bangladesh government portals have TLS configs GitHub runners reject;
          #    they are checked manually during monthly verification passes
          #  - developer.aamarpay.com - live site, incomplete TLS chain on their side
          #    (GoGetSSL intermediate missing since Oct-2026 renewal); verified by hand
          #  - nagad.com.bd / bb.org.bd / linkedin.com / banglaai.org - live sites that reject
          #    or geo-block CI runners (403/999/regional 404); verified by hand instead
          args: >-
            --verbose --no-progress --max-retries 3
            --cache --max-cache-age 2d
            --exclude 'crates\.io|rubygems\.org|packagist\.org|npmjs\.com|\.gov\.bd|nagad\.com\.bd|bb\.org\.bd|linkedin\.com|banglaai\.org|developer\.aamarpay\.com'
            './README.md' './docs/*.md' './CONTRIBUTING.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
