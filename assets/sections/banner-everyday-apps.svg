<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="448" viewBox="0 0 1792 448" role="img" aria-label="Awesome Bangladesh — Everyday apps">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02382a"/>
      <stop offset="0.5" stop-color="#006A4E"/>
      <stop offset="1" stop-color="#02382a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ff8d7a"/>
      <stop offset="0.5" stop-color="#F42A41"/>
      <stop offset="1" stop-color="#b01129"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9962e"/>
      <stop offset="0.5" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#c9962e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#3d0410" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- field -->
  <rect x="4" y="4" width="1784" height="440" rx="36" fill="url(#field)"/>
  <rect x="10" y="10" width="1772" height="428" rx="30" fill="none" stroke="#7dffc9" stroke-opacity="0.3" stroke-width="2.5"/>

  <!-- nakshi kantha running stitches (top + bottom) -->
  <path d="M60 46 H1732" stroke="#f4c95d" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="14 11" stroke-linecap="round"/>
  <path d="M60 402 H1732" stroke="#f4c95d" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="14 11" stroke-linecap="round"/>

  <!-- left emblem: red orb + white smartphone + stitched ring -->
  <g>
    <circle cx="300" cy="224" r="112" fill="url(#sun)" filter="url(#ds)"/>
    <circle cx="300" cy="224" r="112" fill="url(#glass)"/>
    <circle cx="300" cy="224" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.85"
            stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"
            transform="rotate(-18 300 224)"/>
    <g filter="url(#ds)">
      <rect x="272" y="170" width="56" height="110" rx="11" fill="#ffffff"/>
      <rect x="280" y="184" width="40" height="78" rx="4" fill="#006A4E"/>
      <rect x="288" y="270" width="24" height="5" rx="2.5" fill="#006A4E" opacity="0.5"/>
      <circle cx="290" cy="198" r="6" fill="#f4c95d"/>
      <circle cx="310" cy="198" r="6" fill="#ffffff"/>
      <circle cx="290" cy="218" r="6" fill="#ffffff"/>
      <circle cx="310" cy="218" r="6" fill="#F42A41"/>
      <circle cx="290" cy="238" r="6" fill="#F42A41"/>
      <circle cx="310" cy="238" r="6" fill="#f4c95d"/>
    </g>
  </g>

  <!-- center text stack (optically centered between emblem and right icon) -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="1000" y="138" fill="#eaf6f0" font-size="29" letter-spacing="10" font-weight="500">AWESOME BANGLADESH</text>
    <text x="1000" y="224" font-size="84" font-weight="800" fill="url(#gold)" filter="url(#ds)">Everyday apps</text>
    <text x="1000" y="284" fill="#eaf6f0" font-size="31">Daily-life software from Bangladesh</text>
  </g>

  <!-- right emblem: line-art phone inside stitched ring, balancing the left orb -->
  <g>
    <circle cx="1600" cy="196" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
    <circle cx="1600" cy="196" r="112" fill="none" stroke="#f4c95d" stroke-opacity="0.6"
            stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"
            transform="rotate(22 1600 196)"/>
    <g stroke="#ffffff" stroke-opacity="0.95" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1572" y="140" width="56" height="112" rx="12"/>
      <line x1="1590" y1="154" x2="1610" y2="154"/>
      <rect x="1582" y="166" width="15" height="15" rx="4"/>
      <rect x="1605" y="166" width="15" height="15" rx="4"/>
      <rect x="1582" y="190" width="15" height="15" rx="4"/>
      <rect x="1605" y="190" width="15" height="15" rx="4"/>
      <rect x="1582" y="214" width="15" height="15" rx="4"/>
    </g>
    <circle cx="1612" cy="221" r="8" fill="#F42A41"/>
  </g>

  <!-- GitHub handle, bottom right -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff">
    <circle cx="1568" cy="360" r="19" fill="#ffffff"/>
    <path d="M1568 347 a13 13 0 0 0 -13 13 c0 5.8 3.7 10.7 8.9 12.5 0.65 0.1 0.9 -0.3 0.9 -0.65 v-2.4 c-3.6 0.8 -4.4 -1.8 -4.4 -1.8 -0.6 -1.5 -1.5 -1.95 -1.5 -1.95 -1.2 -0.85 0.1 -0.85 0.1 -0.85 1.3 0.1 2 1.4 2 1.4 1.2 2.05 3.15 1.45 3.9 1.1 0.12 -0.9 0.47 -1.5 0.85 -1.85 -3 -0.33 -6.15 -1.5 -6.15 -6.65 0 -1.5 0.5 -2.7 1.4 -3.65 -0.14 -0.35 -0.6 -1.7 0.14 -3.6 0 0 1.16 -0.37 3.8 1.4 a12.9 12.9 0 0 1 6.9 0 c2.64 -1.77 3.8 -1.4 3.8 -1.4 0.74 1.9 0.28 3.25 0.14 3.6 0.9 0.95 1.4 2.15 1.4 3.65 0 5.2 -3.16 6.3 -6.17 6.62 0.47 0.42 0.89 1.2 0.89 2.43 v3.6 c0 0.37 0.23 0.8 0.93 0.66 A13 13 0 0 0 1581 360 a13 13 0 0 0 -13 -13" fill="#006A4E"/>
    <text x="1598" y="370" font-size="28" font-weight="700">/RanaKhan77</text>
  </g>
</svg>
