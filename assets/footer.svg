<svg xmlns="http://www.w3.org/2000/svg" width="896" height="128" viewBox="0 0 896 128" role="img" aria-label="Awesome Bangladesh — Made in Bangladesh">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02382a"/>
      <stop offset="0.45" stop-color="#006A4E"/>
      <stop offset="1" stop-color="#02382a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.38" cy="0.34" r="0.9">
      <stop offset="0" stop-color="#ff8d7a"/>
      <stop offset="0.45" stop-color="#F42A41"/>
      <stop offset="1" stop-color="#b01129"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9962e"/>
      <stop offset="0.5" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#c9962e"/>
    </linearGradient>
  </defs>

  <!-- field -->
  <rect width="896" height="128" rx="18" fill="url(#field)"/>

  <!-- nakshi kantha running-stitch borders -->
  <path d="M14 9 H882" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="12 8" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M14 119 H882" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="12 8" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;20" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- corner stitch motifs -->
  <g stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M8 22 V106 M888 22 V106"/>
    <animate attributeName="opacity" values="0.85;0.35;0.85" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- the rising sun -->
  <circle cx="448" cy="64" r="30" fill="url(#sun)">
    <animate attributeName="r" values="30;32.5;30" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="448" cy="64" r="30" fill="none" stroke="#F42A41" stroke-width="1.6">
    <animate attributeName="r" values="30;74" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="448" cy="64" r="30" fill="none" stroke="#ffd9a8" stroke-width="1">
    <animate attributeName="r" values="30;96" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- sparkles -->
  <g fill="#ffe9b0">
    <circle cx="170" cy="34" r="1.8">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="716" cy="92" r="1.6">
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="30" r="1.4">
      <animate attributeName="opacity" values="0;1;0" dur="3.9s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="98" r="1.5">
