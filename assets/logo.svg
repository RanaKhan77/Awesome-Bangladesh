  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#00a374"/>
      <stop offset="0.55" stop-color="#006A4E"/>
      <stop offset="1" stop-color="#013527"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.36" cy="0.3" r="1">
      <stop offset="0" stop-color="#ff9a88"/>
      <stop offset="0.4" stop-color="#F42A41"/>
      <stop offset="1" stop-color="#a50f26"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001b13" flood-opacity="0.55"/>
    </filter>
    <filter id="discshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3d0410" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- glassy tile -->
  <g filter="url(#soft)">
